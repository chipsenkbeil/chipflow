services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in the environment or a .env file}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in the environment or a .env file}
      POMODORO_MINUTES: ${POMODORO_MINUTES:-25}
      PORT: 3000
      DATABASE_URL: sqlite:/data/app.db?mode=rwc
    volumes:
      - kanban-data:/data
    restart: unless-stopped

volumes:
  kanban-data: {}
